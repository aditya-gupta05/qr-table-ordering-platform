name: qr-ordering

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qr}
      POSTGRES_DB: ${POSTGRES_DB:-qr}
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A fresh named volume is root-owned; the api runs as uid 10001 and must write downloaded models.
  models-init:
    image: busybox:1.37
    command: ["chown", "-R", "10001", "/models"]
    volumes:
      - models:/models

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qr}:${POSTGRES_PASSWORD:-qr}@postgres:5432/${POSTGRES_DB:-qr}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      API_WORKERS: ${API_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      FASTEMBED_CACHE_PATH: /models
      # the api user has no writable $HOME; hf-xet (large-file downloads) needs a cache dir
      HF_HOME: /models/hf
    # prometheus_client multiprocess files live here; in memory, gone on container restart
    tmpfs:
      - /tmp/prom_multiproc:uid=10001
    volumes:
      - models:/models
    ports: ["8000:8000"]
    depends_on:
      models-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  realtime:
    build: ./realtime
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["8080:8080"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/realtime", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api, realtime]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["3000:3000"]
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  pgdata:
  grafanadata:
  models:
